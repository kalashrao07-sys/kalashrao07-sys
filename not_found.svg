<svg width="520" height="185" viewBox="0 0 520 185" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #1a1b27; }
      .border { fill: none; stroke: #414868; stroke-width: 1; }
      .num { font: 800 30px 'Fira Code', Consolas, monospace; letter-spacing: 1px; }
      .sub { font: 400 13px 'Fira Code', Consolas, monospace; fill: #565f89; }
      .cursor { fill: #7aa2f7; }
    </style>
  </defs>

  <rect class="bg" width="520" height="185" rx="10"/>
  <rect class="border" x="0.5" y="0.5" width="519" height="184" rx="10"/>

  <!-- glitch layers -->
  <text x="260" y="68" text-anchor="middle" class="num" fill="#f7768e" opacity="0.75">
    404 NOT FOUND
    <animate attributeName="x" values="260;257;263;259;260" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.75;0.2;0.6;0.75" dur="1.4s" repeatCount="indefinite"/>
  </text>

  <text x="260" y="68" text-anchor="middle" class="num" fill="#7dcfff" opacity="0.75">
    404 NOT FOUND
    <animate attributeName="x" values="260;263;257;261;260" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.75;0.3;0.65;0.75" dur="1.7s" repeatCount="indefinite"/>
  </text>

  <text x="260" y="68" text-anchor="middle" class="num" fill="#c0caf5">404 NOT FOUND</text>

  <text x="260" y="102" text-anchor="middle" class="sub">Whatever you were looking for isn't in this repo.</text>
  <text x="260" y="122" text-anchor="middle" class="sub">No fun facts down here, he he...</text>
  <text x="260" y="150" text-anchor="middle" class="sub">
    <tspan fill="#bb9af7">└──</tspan> try scrolling back up<tspan class="cursor">_</tspan>
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
  </text>
</svg>
