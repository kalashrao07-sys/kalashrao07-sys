name: Update Profile Stats

on:
  schedule:
    - cron: '0 3 * * *'   # daily at 03:00 UTC (~8:30 AM IST)
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests python-dateutil

      - name: Generate stats SVG
        env:
          ACCESS_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python generate_stats.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kalash_stats.svg README.md
          git diff --staged --quiet || git commit -m "chore: update live stats card"
          git push
